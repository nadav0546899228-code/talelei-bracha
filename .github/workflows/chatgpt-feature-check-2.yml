name: Temporary feature check 2

on:
  push:
    branches:
      - chatgpt/mitch-upgrades

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Server syntax
        run: |
          node --check server/mitch.mjs
          node --check server/mitchWorkflow.mjs
          node --check server/activityCenter.mjs
      - name: Feature tests
        run: npm test
      - name: TypeScript changed-files gate
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json > /tmp/ts.out 2>&1
          cat /tmp/ts.out
          if grep -E 'src/admin/(alerts\.ts|views/(MitchView|DashboardView|ActivityCenterView|MitchTransferAudit|DeveloperView)\.tsx)' /tmp/ts.out; then
            echo "TypeScript error found in a file changed by this feature."
            exit 1
          fi
          exit 0
